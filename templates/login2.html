<!DOCTYPE html>
<html lang="pt-Brasil>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://kit.fontawesome.com/2175c0f050.js" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="reset.css">
    <link rel="stylesheet" href="styleslogin.css">
    <title>Login</title>

    <header class="header">
        <div class="container">
            <h1 class="logo">Mapa de Infraestrutura Escolar</h1>
            <nav class="nav">
                <ul class="nav-list">
                    <li><a href="/" class="nav-link {{if eq .CurrentPage "home"}}active{{end}}">Início</a></li>
                    <li><a href="/mapa" class="nav-link {{if eq .CurrentPage "mapa"}}active{{end}}">Mapa</a></li>
                    <li><a href="/cadastro" class="nav-link {{if eq .CurrentPage "cadastro"}}active{{end}}">Cadastrar Escola</a></li>
                    <li><a href="/relatorios" class="nav-link {{if eq .CurrentPage "relatorios"}}active{{end}}">Relatórios</a></li>
                </ul>
            </nav>
        </div>
    </header>

<body>
    <div class="banner">
        <video src="/static/videos/copia.mp4" autoplay muted loop type="copia.mp4"></video>
    </div>
    <main class="container">
        <form>
            <h1>Login</h1>
            <div class="input-box">
                <input placeholder="Usuário" type="email">
                <i class="fa-solid fa-user-large"></i>
            </div>
            <div class="input-box">
                <input placeholder="Senha" type="passwaord">
                <i class="fa-solid fa-lock-open"></i>
            </div>
            <div class="remember-forgot">
                <label>
                <input type="checkbox">Lembrar minha senha
                </label>
                <a href="#">Esqueci minha senha</a>
            </div>
            <button type="submit" class="Login">Login</button>
            <div class="register-link">
                <p>Não tem uma conta? <a href="#">Casdastre-se</a></p>
            </div>
        </form>

    </main>
     <footer class="footer">
        <div class="container">
            <p>&copy; 2025 Mapa de Infraestrutura Escolar</p>
        </div>
    </footer>

    <script src="/static/js/scripts.js"></script>
</body>
</html>
