<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Relatórios - Mapa de Infraestrutura Escolar</title>
    <link rel="stylesheet" href="http://localhost:8080/static/css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <header class="header">
        <div class="container">
            <h1 class="logo">Mapa de Infraestrutura Escolar</h1>
            <nav class="nav">
                <ul class="nav-list">
                    <li><a href="/" class="nav-link">Início</a></li>
                    <li><a href="/mapa" class="nav-link">Mapa</a></li>
                    <li><a href="/cadastro" class="nav-link">Cadastrar Escola</a></li>
                    <li><a href="/relatorios" class="nav-link active">Relatórios</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main class="main">
        <div class="container">
            <h2 class="page-title">Relatórios Estatísticos</h2>
            
            <div class="report-controls">
                <div class="filter-group">
                    <label for="report-type">Tipo de Relatório:</label>
                    <select id="report-type" class="form-control">
                        <option value="students">Alunos por Escola</option>
                        <option value="teachers">Professores por Escola</option>
                        <option value="capacity">Capacidade de Atendimento</option>
                    </select>
                </div>
                <button id="generate-report" class="btn btn-primary">Gerar Relatório</button>
            </div>
            
            <div class="charts-container">
                <div class="chart-wrapper">
                    <canvas id="students-chart"></canvas>
                </div>
                <div class="chart-wrapper">
                    <canvas id="teachers-chart"></canvas>
                </div>
                <div class="chart-wrapper">
                    <canvas id="capacity-chart"></canvas>
                </div>
            </div>
            
            <div class="statistics-summary">
                <h3>Resumo Estatístico</h3>
                <div class="stats-grid">
                    <div class="stat-card">
                        <h4>Total de Escolas</h4>
                        <p id="total-schools">0</p>
                    </div>
                    <div class="stat-card">
                        <h4>Total de Alunos</h4>
                        <p id="total-students">0</p>
                    </div>
                    <div class="stat-card">
                        <h4>Total de Professores</h4>
                        <p id="total-teachers">0</p>
                    </div>
                    <div class="stat-card">
                        <h4>Média Alunos/Professor</h4>
                        <p id="avg-ratio">0</p>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer class="footer">
        <div class="container">
            <p>&copy; 2023 Mapa de Infraestrutura Escolar</p>
        </div>
    </footer>

    <script src="/static/js/scripts.js"></script>
</body>
</html>
