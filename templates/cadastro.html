<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastrar Escola - Mapa de Infraestrutura Escolar</title>
<link rel="stylesheet" href="http://localhost:8080/static/css/style.css"></head>
<body>
    <header class="header">
        <div class="container">
            <h1 class="logo">Mapa de Infraestrutura Escolar</h1>
            <nav class="nav">
                <ul class="nav-list">
                    <li><a href="/" class="nav-link">Início</a></li>
                    <li><a href="/mapa" class="nav-link">Mapa</a></li>
                    <li><a href="/cadastro" class="nav-link active">Cadastrar Escola</a></li>
                    <li><a href="/relatorios" class="nav-link">Relatórios</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main class="main">
        <div class="container">
            <h2 class="page-title">Cadastrar Nova Escola</h2>
            <form id="school-form" class="school-form">
                <div class="form-group">
                    <label for="school-name">Nome da Escola *</label>
                    <input type="text" id="school-name" class="form-control" required>
                </div>
                
                <div class="form-group">
                    <label for="school-address">Endereço *</label>
                    <input type="text" id="school-address" class="form-control" required>
                </div>
                
                <div class="form-row">
                    <div class="form-group">
                        <label for="students-count">Número de Alunos *</label>
                        <input type="number" id="students-count" class="form-control" min="0" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="teachers-count">Número de Professores *</label>
                        <input type="number" id="teachers-count" class="form-control" min="0" required>
                    </div>
                </div>
                
                <div class="form-group">
                    <label>Estrutura Física</label>
                    <div class="checkbox-group">
                        <label class="checkbox-label">
                            <input type="checkbox" name="infrastructure" value="library"> Biblioteca
                        </label>
                        <label class="checkbox-label">
                            <input type="checkbox" name="infrastructure" value="lab"> Laboratório de Informática
                        </label>
                        <label class="checkbox-label">
                            <input type="checkbox" name="infrastructure" value="sports"> Quadra Esportiva
                        </label>
                        <label class="checkbox-label">
                            <input type="checkbox" name="infrastructure" value="auditorium"> Auditório
                        </label>
                        <label class="checkbox-label">
                            <input type="checkbox" name="infrastructure" value="cafeteria"> Refeitório
                        </label>
                    </div>
                </div>
                
                <div class="form-actions">
                    <button type="submit" class="btn btn-primary">Cadastrar Escola</button>
                    <button type="reset" class="btn btn-secondary">Limpar Formulário</button>
                </div>
            </form>
        </div>
    </main>

    <footer class="footer">
        <div class="container">
            <p>&copy; 2023 Mapa de Infraestrutura Escolar</p>
        </div>
    </footer>

    <script src="/static/js/scripts.js"></script>
</body>
</html>
